models:
  brain: muse-spark-1.3          # agent loop + claim check + visual check
  image: muse-image-1.0          # cover / background generation
  segment: sam-3.1               # product cutouts
  transcribe: muse-voice-transcribe-1.0

api:
  base_url: https://api.meta.ai/v1
  max_retries: 3
  timeout_s: 120

voice:
  languages: [English]        # languageBias for Voice Transcribe (auto-detect guessed Korean on English audio)

agent:
  max_turns: 40
  max_outline_rejects: 3
  max_submit_rejects: 3

render:
  width: 1080
  height: 1350
  safe_margin: 72
  min_body_px: 30
  min_title_px: 56
  min_contrast: 4.5
  qa_preview: [540, 675]       # size sent to Spark for visual QA (saves credits)

citation:
  min_quote_chars: 15
